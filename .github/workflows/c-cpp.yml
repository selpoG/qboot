name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build_matrix:
    name: build (${{ matrix.compiler }}, C++${{ matrix.standard }}, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        compiler: [g++-14, clang++-18]
        standard: [20, 23]

    steps:
    - uses: actions/checkout@v5
    - name: requirement
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libmpfr-dev g++-14 clang-18
    - name: configure
      run: >-
        cmake -S . -B build
        -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
        -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_INSTALL_PREFIX="$HOME/local"
        -Dqboot_build_tests=ON -Dqboot_warnings_as_errors=ON
    - name: make
      run: cmake --build build --parallel 2
    - name: make install
      run: cmake --install build
    - name: test
      run: ctest --test-dir build --output-on-failure
    - name: installed package
      run: |
        cmake -S test/consumer -B consumer-build \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_PREFIX_PATH="$HOME/local"
        cmake --build consumer-build --parallel 2
        ctest --test-dir consumer-build --output-on-failure
    - name: sample project
      run: |
        cmake -S sample -B sample-build \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_PREFIX_PATH="$HOME/local" \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
        cmake --build sample-build --parallel 2

  libcxx:
    name: libc++ (C++${{ matrix.standard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        standard: [20, 23]
    steps:
    - uses: actions/checkout@v5
    - name: requirement
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libmpfr-dev clang-20 libc++-20-dev libc++abi-20-dev
    - name: Build GMP with libc++
      run: |
        cd "$RUNNER_TEMP"
        curl -fL --retry 3 https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz -o gmp-6.3.0.tar.xz
        echo 'a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898  gmp-6.3.0.tar.xz' | sha256sum --check
        tar -xf gmp-6.3.0.tar.xz
        cd gmp-6.3.0
        ./configure --prefix="$RUNNER_TEMP/qboot-gmp" --enable-cxx --disable-static \
          CC=clang-20 CXX=clang++-20 CXXFLAGS="-O2 -stdlib=libc++"
        make -j2
        make install
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/qboot-gmp/lib" >> "$GITHUB_ENV"
    - name: build and test
      run: |
        cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-20 \
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }} -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/qboot-gmp" \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/local" \
          -Dqboot_build_tests=ON -Dqboot_warnings_as_errors=ON
        cmake --build build --parallel 2
        ctest --test-dir build --output-on-failure
        cmake --install build
    - name: installed package and sample
      run: |
        cmake -S test/consumer -B consumer-build -DCMAKE_CXX_COMPILER=clang++-20 \
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }} -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/local"
        cmake --build consumer-build --parallel 2
        ctest --test-dir consumer-build --output-on-failure
        cmake -S sample -B sample-build -DCMAKE_CXX_COMPILER=clang++-20 \
          -DCMAKE_CXX_STANDARD=${{ matrix.standard }} \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -Wall -Wextra -Wpedantic -Werror" \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/local"
        cmake --build sample-build --parallel 2

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: requirement
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libmpfr-dev clang-18
    - name: configure
      run: >-
        cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++-18
        -DCMAKE_CXX_STANDARD=23 -DCMAKE_BUILD_TYPE=Debug
        -Dqboot_build_tests=ON -Dqboot_warnings_as_errors=ON
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
    - name: build and test
      env:
        ASAN_OPTIONS: detect_leaks=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        cmake --build build --parallel 2 --target qboot_smoke qboot_json qboot_regression qboot_modern
        ctest --test-dir build --output-on-failure

  sdpb:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: Build PMP fixtures
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libmpfr-dev
        cmake -S . -B build -Dqboot_build_tests=ON -Dqboot_warnings_as_errors=ON
        cmake --build build --parallel 2 --target qboot_json qboot_smoke
        QBOOT_TEST_OUTPUT="$PWD/pmp" build/bin/qboot_json
        QBOOT_TEST_OUTPUT="$PWD/pmp/bootstrap" build/bin/qboot_smoke
    - name: Convert and solve with SDPB 3.1.0
      run: |
        docker run --rm -v "$PWD/pmp:/data" bootstrapcollaboration/sdpb:3.1.0 \
          pmp2sdp --precision=256 --input=/data/matrices.json --output=/data/matrices-sdp
        docker run --rm -v "$PWD/pmp:/data" bootstrapcollaboration/sdpb:3.1.0 \
          pmp2sdp --precision=256 --input=/data/bootstrap/input.json --output=/data/bootstrap-sdp
        docker run --rm -v "$PWD/pmp:/data" bootstrapcollaboration/sdpb:3.1.0 \
          pmp2sdp --precision=256 --input=/data/bounded.json --output=/data/sdp
        docker run --rm -v "$PWD/pmp:/data" bootstrapcollaboration/sdpb:3.1.0 \
          sdpb --precision=256 --sdpDir=/data/sdp --outDir=/data/out \
          --maxIterations=300 --dualityGapThreshold=1e-30 \
          --primalErrorThreshold=1e-30 --dualErrorThreshold=1e-30
        python3 test/check_sdpb.py pmp/out/out.txt
        for degree in 0 1 2; do
          for format in json xml; do
            docker run --rm -v "$PWD/pmp:/data" bootstrapcollaboration/sdpb:3.1.0 \
              pmp2sdp --precision=256 --outputFormat=json \
              --input="/data/consistency-$degree.$format" --output="/data/converted-$degree-$format"
          done
        done
        python3 test/check_sdpb_consistency.py pmp

  build:
    runs-on: ubuntu-24.04
    needs: [build_matrix, libcxx, sanitizers, sdpb]
    if: ${{ always() }}
    steps:
    - name: Check all build configurations
      env:
        BUILD_RESULT: ${{ needs.build_matrix.result }}
        LIBCXX_RESULT: ${{ needs.libcxx.result }}
        SANITIZER_RESULT: ${{ needs.sanitizers.result }}
        SDPB_RESULT: ${{ needs.sdpb.result }}
      run: test "$BUILD_RESULT" = success && test "$LIBCXX_RESULT" = success && test "$SANITIZER_RESULT" = success && test "$SDPB_RESULT" = success
