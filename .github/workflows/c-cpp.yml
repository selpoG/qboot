name: C/C++ CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: requirement
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmp-dev libmpfr-dev
    - name: configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX="$HOME/local"
    - name: make
      run: cmake --build build --parallel 2
    - name: make install
      run: cmake --install build
